<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIK TK PKK Lestari</title>
<link rel="icon" href="logo-tk.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
<style type="text/tailwindcss">
@layer components{
.card{@apply bg-white rounded-2xl border border-slate-200 shadow-sm}
.inp{@apply w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500}
.lbl{@apply block text-xs font-semibold text-slate-600 mb-1.5}
.btn{@apply inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold text-white transition}
.th{@apply px-3 sm:px-5 py-3 text-left text-xs font-semibold text-slate-500 bg-slate-50 whitespace-nowrap}
.td{@apply px-3 sm:px-5 py-3 text-sm}
.nav-i{@apply flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 text-left}
.badge{@apply inline-block rounded-md px-2 py-0.5 text-xs font-bold}
}
</style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

<!-- LOGIN -->
<section id="login" class="min-h-screen grid place-items-center p-4 bg-gradient-to-br from-indigo-50 via-white to-violet-100">
  <div class="card w-full max-w-md p-6 sm:p-8">
    <div class="text-center">
      <div class="mx-auto grid h-24 w-24 place-items-center overflow-hidden rounded-full border-4 border-white bg-indigo-50 shadow-md">
        <img src="logo-tk.png" alt="Logo TK PKK Lestari" class="h-full w-full object-cover" onerror="this.replaceWith(Object.assign(document.createElement('i'),{className:'fas fa-school text-3xl text-indigo-600'}))">
      </div>
      <h1 class="mt-4 text-2xl font-extrabold">Sistem Informasi Keuangan</h1>
      <p class="text-sm text-slate-500">TK PKK Lestari</p>
    </div>
    <form id="lf" class="mt-6 space-y-4">
      <div><label class="lbl" for="u">Username</label><input id="u" class="inp" required autocomplete="username"></div>
      <div><label class="lbl" for="p">Password</label>
        <div class="relative">
          <input id="p" type="password" class="inp pr-11" required autocomplete="current-password">
          <button type="button" data-act="eye" class="absolute inset-y-0 right-0 grid w-11 place-items-center text-slate-400 hover:text-indigo-600" aria-label="Tampilkan password" title="Tampilkan / sembunyikan password"><i id="eye-i" class="fas fa-eye"></i></button>
        </div>
      </div>
      <button class="btn w-full bg-indigo-600 hover:bg-indigo-700 py-3">Masuk</button>
    </form>
    <p class="mt-6 text-center text-xs text-slate-400">&copy; <span class="yr"></span> - Developed by M. Daisak Syamaidzar</p>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <div id="ov" class="fixed inset-0 z-30 hidden bg-slate-900/40 lg:hidden"></div>
  <aside id="side" class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col border-r border-slate-200 bg-white transition-transform lg:translate-x-0">
    <div class="flex h-16 items-center gap-3 border-b border-slate-200 px-4">
      <div class="grid h-10 w-10 shrink-0 place-items-center overflow-hidden rounded-full bg-indigo-50">
        <img src="logo-tk.png" alt="Logo" class="h-full w-full object-cover" onerror="this.replaceWith(Object.assign(document.createElement('i'),{className:'fas fa-school text-indigo-600'}))">
      </div>
      <div class="leading-tight"><div class="font-bold">SIK TK Lestari</div><div class="text-xs text-slate-500">TK PKK Lestari</div></div>
    </div>
    <nav id="nav" class="flex-1 space-y-1 overflow-y-auto p-3"></nav>
    <div class="border-t border-slate-200 p-3">
      <button data-act="logout" class="nav-i text-rose-600 hover:bg-rose-50"><i class="fas fa-right-from-bracket w-5 text-center"></i>Keluar</button>
    </div>
  </aside>

  <div class="flex min-h-screen flex-col lg:pl-64">
    <header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-slate-200 bg-white/90 px-4 backdrop-blur sm:px-6">
      <button data-act="menu" class="grid h-10 w-10 place-items-center rounded-xl border border-slate-200 lg:hidden" aria-label="Menu"><i class="fas fa-bars"></i></button>
      <div class="min-w-0 text-sm text-slate-500"><i class="fas fa-house text-xs"></i> <span class="mx-1">›</span> <span id="crumb" class="font-semibold text-slate-800"></span></div>
      <div class="ml-auto flex items-center gap-3">
        <div class="hidden text-right leading-tight sm:block"><div id="uname" class="text-sm font-semibold"></div><div id="urole" class="text-xs text-indigo-600"></div></div>
        <div id="uav" class="grid h-10 w-10 place-items-center rounded-xl bg-indigo-600 font-bold text-white"></div>
      </div>
    </header>
    <main id="content" class="mx-auto w-full max-w-7xl flex-1 p-4 sm:p-6"></main>
    <footer class="px-4 pb-5 pt-2 text-center text-xs text-slate-400 sm:px-6">&copy; <span class="yr"></span> - Developed by M. Daisak Syamaidzar</footer>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzRFRkax0bnnT1PilebjqaBUY3sMXtj3nyzKcc7qG6wVQabTLQRLlRiVcOI8BnhtA98rg/exec";

// ---------- Util ----------
const $ = i => document.getElementById(i);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => new Intl.NumberFormat('id-ID', {style:'currency', currency:'IDR', maximumFractionDigits:0}).format(Number(n) || 0);
const tgl = s => { const d = new Date(s); return isNaN(d) ? '-' : d.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}); };
const num = id => Number(($(id).value || '').replace(/\D/g, '')) || 0;
const role = () => user.role.toLowerCase();
let user = null, siswa = [], settings = {}, busy = false, lastAct = Date.now(), allS = [], lap = [], kasTangan = 0;

const store = {
  get(){ try { return JSON.parse(sessionStorage.getItem('sik')); } catch { return null; } },
  set(v){ try { sessionStorage.setItem('sik', JSON.stringify(v)); } catch {} },
  del(){ try { sessionStorage.removeItem('sik'); } catch {} }
};
const T = Swal.mixin({toast:true, position:'top-end', showConfirmButton:false, timer:3000, timerProgressBar:true});
const toast = (m, ok = true) => T.fire({icon: ok ? 'success' : 'error', title: m});
const warn = t => Swal.fire({icon:'warning', title:t, confirmButtonColor:'#4f46e5'});
const ask = (title, text, btn = 'Ya, lanjutkan') => Swal.fire({title, text, icon:'question', showCancelButton:true, confirmButtonText:btn, cancelButtonText:'Batal', confirmButtonColor:'#4f46e5'}).then(r => r.isConfirmed);
async function work(fn, msg = 'Memproses...') {
  if (busy) return null;               // cegah klik ganda
  busy = true;
  Swal.fire({title:msg, allowOutsideClick:false, showConfirmButton:false, didOpen:() => Swal.showLoading()});
  try { return await fn(); } finally { busy = false; Swal.close(); }
}

async function api(action, payload = {}) {
  try {
    const r = await fetch(API_URL, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action, payload, token: user && user.token})});
    let j; try { j = await r.json(); } catch { return {success:false, message:'Respons server tidak valid.'}; }
    if (j.code === 'AUTH' && action !== 'login') forceLogout(j.message);
    return j;
  } catch { return {success:false, message:'Koneksi ke server gagal. Periksa internet Anda.'}; }
}

// ---------- Komponen UI ----------
const G = {indigo:'from-indigo-500 to-violet-500', green:'from-emerald-500 to-green-600', cyan:'from-sky-500 to-cyan-600', orange:'from-orange-500 to-rose-500'};
const stat = (c, l, v, i, s = '') => `<div class="relative overflow-hidden rounded-2xl bg-gradient-to-br ${G[c]} p-5 text-white shadow-sm">
  <div class="text-sm font-medium opacity-90">${l}</div>
  <div class="mt-2 break-words text-2xl font-extrabold tracking-tight sm:text-3xl">${v}</div>
  <div class="mt-1 text-xs opacity-90">${s}</div>
  <span class="absolute right-4 top-4 grid h-10 w-10 place-items-center rounded-xl bg-white/20"><i class="fas ${i}"></i></span></div>`;
const head = (t, s) => `<div class="mb-5"><h1 class="text-2xl font-bold">${t}</h1><p class="text-sm text-slate-500">${s}</p></div>`;
const tbl = (h, b) => `<div class="overflow-x-auto"><table class="min-w-full divide-y divide-slate-100"><thead><tr>${h.map(x => `<th class="th ${x[1] || ''}">${x[0]}</th>`).join('')}</tr></thead>
  <tbody class="divide-y divide-slate-100">${b || `<tr><td colspan="${h.length}" class="td py-10 text-center text-slate-400">Belum ada data.</td></tr>`}</tbody></table></div>`;
const view = h => { $('content').innerHTML = h; };
const loading = () => view('<div class="py-20 text-center text-slate-400"><i class="fas fa-spinner fa-spin text-2xl"></i></div>');
const field = (l, inner) => `<div><label class="lbl">${l}</label>${inner}</div>`;
const money = (id, ph = '5.000') => `<input id="${id}" class="inp money text-base font-bold" inputmode="numeric" placeholder="${ph}">`;
const bdg = (t, c) => `<span class="badge ${c}">${esc(t)}</span>`;
const fail = r => { if (r && !r.success) toast(r.message, false); return r && r.success; };

function fill(sel, q = '') {
  q = q.toLowerCase();
  const list = siswa.filter(s => (s.nama + s.nisn).toLowerCase().includes(q));
  $(sel).innerHTML = '<option value="">-- Pilih siswa --</option>' + list.map(s => `<option value="${esc(s.nisn)}">${esc(s.nama)} (${esc(s.kelas)})</option>`).join('');
  if (q && list.length === 1) { $(sel).value = list[0].nisn; $(sel).dispatchEvent(new Event('change', {bubbles:true})); }
}
async function loadSiswa() { const r = await api('getDataSiswa'); if (r.success) siswa = r.data; else toast(r.message, false); }

// ---------- Menu & navigasi ----------
const MENUS = {
  guru: [['input','fa-piggy-bank','Input Tabungan'], ['riwayat','fa-clock-rotate-left','Riwayat Siswa'], ['setor','fa-paper-plane','Setor Kas']],
  bendahara: [['spp','fa-file-invoice-dollar','Pembayaran SPP'], ['kas','fa-book','Buku Kas SPP']],
  kepsek: [['rekap','fa-chart-pie','Rekap Tabungan'], ['verif','fa-clipboard-check','Verifikasi Setoran'], ['laporan','fa-clipboard-list','Laporan Setoran'], ['kas','fa-book','Buku Kas SPP']],
  admin: [['rekap','fa-chart-pie','Rekap Tabungan'], ['siswa','fa-user-graduate','Kelola Siswa'], ['keluar','fa-cart-shopping','Kas Keluar'], ['kas','fa-book','Buku Kas SPP'], ['atur','fa-gear','Pengaturan']]
};

function start() {
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('uname').textContent = user.name; $('urole').textContent = user.role + (user.kelas ? ' • ' + user.kelas : '');
  $('uav').textContent = (user.name || '?').charAt(0).toUpperCase();
  const m = MENUS[role()] || [];
  $('nav').innerHTML = m.map(x => `<button data-go="${x[0]}" class="nav-i"><i class="fas ${x[1]} w-5 text-center"></i>${x[2]}</button>`).join('');
  api('getPengaturan').then(r => { if (r.success) settings = r.data; });
  if (m.length) go(m[0][0]);
}
function go(id) {
  side(false);
  const item = (MENUS[role()] || []).find(x => x[0] === id); if (!item) return;
  $('crumb').textContent = item[2];
  document.querySelectorAll('.nav-i[data-go]').forEach(b => {
    const on = b.dataset.go === id;
    b.classList.toggle('bg-indigo-50', on); b.classList.toggle('text-indigo-600', on);
  });
  loading(); PAGES[id]();
}
function side(open) {
  $('side').classList.toggle('-translate-x-full', !open);
  $('ov').classList.toggle('hidden', !open);
}
function forceLogout(msg) {
  user = null; store.del(); siswa = []; allS = []; lap = []; settings = {};
  $('content').innerHTML = ''; $('lf').reset();
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  if (msg) toast(msg, false);
}

// ---------- Halaman ----------
const PAGES = {
  // === GURU ===
  async input() {
    view(head('Input tabungan', 'Catat uang masuk atau penarikan tabungan siswa') + `<div class="card max-w-2xl space-y-4 p-5 sm:p-6">
      ${field('Cari siswa', '<input class="inp" data-q="s-siswa" placeholder="Ketik nama siswa...">')}
      ${field('Siswa', '<select id="s-siswa" class="inp"></select><div id="saldo" class="mt-2 text-sm font-semibold text-emerald-600"></div>')}
      ${field('Jenis transaksi', '<select id="jenis" class="inp"><option value="Nabung">Menabung (uang masuk)</option><option value="Tarik">Penarikan (uang keluar)</option></select>')}
      ${field('Nominal (Rp)', money('nom') + `<div class="mt-2 flex flex-wrap gap-2">${[1000,2000,5000,10000].map(n => `<button type="button" data-act="chip" data-n="${n}" class="rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-semibold hover:bg-indigo-100">${n.toLocaleString('id-ID')}</button>`).join('')}</div>`)}
      <button data-act="trx" class="btn w-full bg-indigo-600 py-3 hover:bg-indigo-700"><i class="fas fa-floppy-disk"></i>Simpan transaksi</button></div>`);
    await loadSiswa(); fill('s-siswa');
  },
  async riwayat() {
    view(head('Riwayat siswa', 'Lihat dan batalkan transaksi yang salah input') + `<div class="card overflow-hidden"><div class="grid gap-3 border-b border-slate-200 p-5 sm:grid-cols-2">
      ${field('Cari siswa', '<input class="inp" data-q="r-siswa" placeholder="Ketik nama siswa...">')}${field('Siswa', '<select id="r-siswa" class="inp"></select>')}</div>
      <div id="riw"><p class="py-10 text-center text-slate-400">Pilih siswa untuk melihat riwayat.</p></div></div>`);
    await loadSiswa(); fill('r-siswa');
  },
  async setor() {
    view(head('Setor kas', 'Serahkan uang tabungan ke Kepala Sekolah') + `<div class="mb-5 grid gap-5 md:grid-cols-2"><div id="kas"></div>
      <div class="card space-y-4 p-5">${field('Nominal setoran (Rp)', money('nom-setor', 'Jumlah yang disetor'))}
      <button data-act="setor" class="btn w-full bg-emerald-600 py-3 hover:bg-emerald-700"><i class="fas fa-paper-plane"></i>Kirim setoran</button></div></div>
      <div class="card overflow-hidden"><div class="border-b border-slate-200 p-5 font-semibold">Saldo siswa kelas Anda</div><div id="rk"></div></div>`);
    const [a] = await Promise.all([api('getInfoSetoranGuru'), loadSiswa()]);
    kasTangan = a.success ? a.kasTangan : 0;
    $('kas').innerHTML = stat(kasTangan < 0 ? 'orange' : 'green', 'Kas di tangan (belum disetor)', rp(kasTangan), 'fa-money-bill-wave', a.peringatan ? esc(a.peringatan) : '');
    $('rk').innerHTML = tbl([['NISN'], ['Nama'], ['Saldo', 'text-right']], siswa.map(s => `<tr><td class="td text-slate-500">${esc(s.nisn)}</td><td class="td font-semibold">${esc(s.nama)}</td><td class="td text-right font-bold ${s.saldo > 0 ? 'text-emerald-600' : 'text-slate-400'}">${rp(s.saldo)}</td></tr>`).join(''));
  },

  // === BENDAHARA ===
  async spp() {
    const now = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 7);
    const nom = Number(settings.Nominal_SPP) || 0;
    view(head('Pembayaran SPP', 'Catat SPP bulanan siswa') + `<div class="card max-w-2xl space-y-4 p-5 sm:p-6">
      ${nom <= 0 ? '<div class="rounded-xl bg-amber-50 p-3 text-sm text-amber-800">Nominal SPP belum diatur. Minta Admin mengisinya di menu Pengaturan.</div>' : ''}
      ${field('Cari siswa', '<input class="inp" data-q="spp-siswa" placeholder="Ketik nama siswa...">')}
      ${field('Siswa', '<select id="spp-siswa" class="inp"></select>')}
      ${field('Untuk bulan', `<input type="month" id="spp-bln" class="inp" value="${now}">`)}
      ${field('Nominal tagihan', `<input class="inp bg-slate-100 font-bold text-slate-500" value="${rp(nom)}" readonly>`)}
      <button data-act="spp" class="btn w-full bg-orange-500 py-3 hover:bg-orange-600"><i class="fas fa-check"></i>Catat pembayaran SPP</button></div>`);
    await loadSiswa(); fill('spp-siswa');
  },
  async kas() {
    const r = await api('getBukuKasBendahara'); if (!fail(r)) return view('');
    view(head('Buku kas SPP', 'Pemasukan dan pengeluaran kas SPP') + `<div class="mb-5 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
      ${stat('orange', 'Saldo kas terkini', rp(r.saldoAkhir), 'fa-wallet')}${stat('indigo', 'Saldo awal', rp(r.saldoAwal), 'fa-flag')}
      ${stat('green', 'Total SPP masuk', rp(r.totalMasukSPP), 'fa-arrow-down')}${stat('cyan', 'Total pengeluaran', rp(r.totalKeluar), 'fa-arrow-up')}</div>
      <div class="card overflow-hidden">${tbl([['Waktu'], ['Keterangan'], ['Jenis'], ['Nominal', 'text-right'], ['Saldo', 'text-right']], r.data.map(d => `<tr>
        <td class="td whitespace-nowrap text-xs text-slate-500">${tgl(d.tanggal)}</td><td class="td font-semibold">${esc(d.keterangan)}</td>
        <td class="td">${bdg(d.tipe, d.tipe === 'Pengeluaran' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700')}</td>
        <td class="td text-right font-bold ${d.masuk > 0 ? 'text-emerald-600' : 'text-rose-600'}">${d.masuk > 0 ? rp(d.masuk) : '-' + rp(d.keluar)}</td>
        <td class="td text-right text-slate-500">${rp(d.saldo)}</td></tr>`).join(''))}</div>`);
  },

  // === KEPSEK & ADMIN ===
  async rekap() {
    const r = await api('getRekapData'); if (!fail(r)) return view('');
    allS = r.detailSiswa;
    const ok = Math.round(r.selisih) === 0;
    view(head('Rekap tabungan', 'Posisi tabungan seluruh siswa dan kas sekolah') + `<div class="mb-5 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
      ${stat('indigo', 'Total tabungan siswa', rp(r.totalSiswaSaldo), 'fa-building-columns')}
      ${stat('green', 'Kas fisik seharusnya', rp(r.totalKasFisik), 'fa-money-bill-wave', 'Setelah pengeluaran tabungan')}
      ${stat('cyan', 'Kas guru + Kepsek', rp(r.kasGuru + r.setoranPending + r.kasKepsek), 'fa-users', `Guru ${rp(r.kasGuru)} • Pending ${rp(r.setoranPending)} • Kepsek ${rp(r.kasKepsek)}`)}
      ${stat(ok ? 'green' : 'orange', 'Selisih balance', rp(r.selisih), 'fa-scale-balanced', ok ? 'Balance' : 'Tidak balance, periksa transaksi')}</div>
      <div class="card mb-5 p-5"><div class="mb-3 text-sm font-semibold">Kas tabungan per kelas</div><div class="grid grid-cols-2 gap-3 md:grid-cols-4">
      ${Object.entries(r.rekapKelas).map(([k, v]) => `<div class="rounded-xl border border-slate-200 bg-slate-50 p-3"><div class="text-xs text-slate-500">${esc(k)}</div><div class="font-bold text-indigo-600">${rp(v)}</div></div>`).join('')}</div></div>
      <div class="card overflow-hidden"><div class="flex flex-col gap-3 border-b border-slate-200 p-5 sm:flex-row sm:items-center sm:justify-between"><div class="font-semibold">Daftar buku tabungan siswa</div>
      <input class="inp sm:w-72" data-q="rekap" placeholder="Cari NISN atau nama..."></div><div id="rekap-tbl"></div></div>`);
    renderRekap('');
  },
  async verif() {
    const [a, b] = await Promise.all([api('getAllGuruKasTangan'), api('getSetoranPending')]);
    view(head('Verifikasi setoran', 'Setujui uang fisik yang diserahkan wali kelas') + `<div class="card mb-5 p-5"><div class="mb-3 font-semibold">Kas tabungan di tangan wali kelas</div>
      <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">${(a.success ? a.data : []).map(g => `<div class="rounded-xl border border-slate-200 p-4"><div class="text-xs text-slate-500">${esc(g.kelas)}</div><div class="font-semibold">${esc(g.guru)}</div>
      <div class="mt-1 text-lg font-extrabold ${g.kasTangan < 0 ? 'text-rose-600' : 'text-amber-600'}">${rp(g.kasTangan)}</div></div>`).join('') || '<p class="text-slate-400">Belum ada data.</p>'}</div></div>
      <div class="card overflow-hidden"><div class="border-b border-slate-200 p-5 font-semibold">Setoran menunggu persetujuan</div>
      ${tbl([['Waktu'], ['Guru / kelas'], ['Nominal'], ['Aksi', 'text-center']], (b.success ? b.data : []).map(d => `<tr><td class="td whitespace-nowrap text-xs text-slate-500">${tgl(d.tanggal)}</td>
        <td class="td"><b>${esc(d.guru)}</b><div class="text-xs text-slate-400">${esc(d.kelas)}</div></td><td class="td font-bold text-emerald-600">${rp(d.nominal)}</td>
        <td class="td text-center"><button data-act="acc" data-id="${esc(d.id)}" class="btn bg-emerald-600 px-3 py-1.5 text-xs hover:bg-emerald-700"><i class="fas fa-check"></i>Terima</button></td></tr>`).join(''))}</div>`);
  },
  async laporan() {
    const r = await api('getLaporanSetoran'); if (!fail(r)) return view('');
    lap = r.data;
    view(head('Laporan setoran', 'Riwayat setoran yang sudah disetujui') + `<div class="card overflow-hidden"><div class="flex flex-col gap-3 border-b border-slate-200 p-5 sm:flex-row sm:items-center sm:justify-between">
      <div class="font-semibold">Setoran disetujui</div><select id="f-lap" class="inp sm:w-48"><option value="semua">Semua waktu</option><option value="bulan">Bulan ini</option><option value="tahun">Tahun ini</option></select></div>
      <div id="lap-tbl"></div><div class="border-t border-slate-200 bg-slate-50 p-4 text-right text-sm">Total: <b id="lap-total" class="text-xl text-indigo-600"></b></div></div>`);
    renderLap();
  },
  async siswa() {
    view(head('Kelola siswa', 'Tambah data siswa baru') + `<div class="card max-w-2xl space-y-4 p-5 sm:p-6">
      ${field('NISN', '<input id="a-nisn" class="inp">')}${field('Nama lengkap', '<input id="a-nama" class="inp">')}${field('Kelas', '<input id="a-kelas" class="inp" placeholder="Contoh: TK A">')}
      <button data-act="addSiswa" class="btn w-full bg-indigo-600 py-3 hover:bg-indigo-700"><i class="fas fa-floppy-disk"></i>Simpan siswa</button></div>`);
  },
  async keluar() {
    view(head('Kas keluar', 'Catat pengeluaran operasional') + `<div class="card mb-5 grid gap-4 p-5 sm:grid-cols-3 sm:p-6">
      ${field('Sumber dana', '<select id="o-sumber" class="inp"><option value="Tabungan">Kas Tabungan</option><option value="SPP">Kas SPP</option><option value="Rekreasi">Kas Rekreasi</option></select>')}
      ${field('Keperluan', '<input id="o-ket" class="inp" placeholder="Contoh: Beli ATK">')}${field('Nominal (Rp)', money('o-nom', '50.000'))}
      <button data-act="keluar" class="btn bg-rose-500 hover:bg-rose-600 sm:col-span-3"><i class="fas fa-minus-circle"></i>Potong kas</button></div>
      <div class="card overflow-hidden"><div class="border-b border-slate-200 p-5 font-semibold">Riwayat pengeluaran</div><div id="o-tbl"></div></div>`);
    const r = await api('getLaporanPengeluaran');
    $('o-tbl').innerHTML = tbl([['Tanggal'], ['Sumber'], ['Keperluan'], ['Nominal', 'text-right']], (r.success ? r.data : []).map(d => `<tr><td class="td whitespace-nowrap text-xs text-slate-500">${tgl(d.tanggal)}</td>
      <td class="td">${bdg(d.sumber, d.sumber === 'Tabungan' ? 'bg-indigo-100 text-indigo-700' : 'bg-orange-100 text-orange-700')}</td><td class="td font-semibold">${esc(d.keterangan)}</td>
      <td class="td text-right font-bold text-rose-600">-${rp(d.nominal)}</td></tr>`).join(''));
  },
  async atur() {
    const r = await api('getPengaturan'); if (r.success) settings = r.data;
    const f = n => (Number(n) || 0).toLocaleString('id-ID');
    view(head('Pengaturan', 'Nominal SPP dan saldo awal kas Bendahara') + `<div class="card max-w-md space-y-4 p-5 sm:p-6">
      ${field('Nominal SPP bulanan (Rp)', `<input id="st-spp" class="inp money font-bold" inputmode="numeric" value="${f(settings.Nominal_SPP)}">`)}
      ${field('Saldo awal kas Bendahara (Rp)', `<input id="st-saldo" class="inp money font-bold" inputmode="numeric" value="${f(settings.Saldo_Awal_Bendahara)}">`)}
      <button data-act="atur" class="btn w-full bg-slate-800 py-3 hover:bg-slate-900">Simpan pengaturan</button></div>`);
  }
};
PAGES.kasspp = PAGES.kas;

function renderRekap(q) {
  q = q.toLowerCase();
  $('rekap-tbl').innerHTML = tbl([['Kelas'], ['NISN'], ['Nama'], ['Saldo', 'text-right']], allS.filter(s => (s.nama + s.nisn).toLowerCase().includes(q)).map(s => `<tr>
    <td class="td">${bdg(s.kelas, 'bg-indigo-100 text-indigo-700')}</td><td class="td text-slate-500">${esc(s.nisn)}</td><td class="td font-semibold">${esc(s.nama)}</td>
    <td class="td text-right font-bold ${s.saldo > 0 ? 'text-emerald-600' : s.saldo < 0 ? 'text-rose-600' : 'text-slate-400'}">${rp(s.saldo)}</td></tr>`).join(''));
}
function renderLap() {
  const f = $('f-lap').value, now = new Date(); let total = 0;
  const list = lap.filter(d => { const x = new Date(d.tgl_acc); if (f === 'bulan') return x.getMonth() === now.getMonth() && x.getFullYear() === now.getFullYear(); if (f === 'tahun') return x.getFullYear() === now.getFullYear(); return true; });
  $('lap-tbl').innerHTML = tbl([['Disetujui'], ['Guru penyetor'], ['Nominal', 'text-right']], list.map(d => { total += Number(d.nominal) || 0;
    return `<tr><td class="td whitespace-nowrap text-slate-500">${tgl(d.tgl_acc)}</td><td class="td font-semibold">${esc(d.guru)} <span class="text-xs text-slate-400">(${esc(d.kelas)})</span></td><td class="td text-right font-bold text-indigo-600">${rp(d.nominal)}</td></tr>`; }).join(''));
  $('lap-total').textContent = rp(total);
}
async function loadRiw() {
  const n = $('r-siswa').value, box = $('riw');
  if (!n) return box.innerHTML = '<p class="py-10 text-center text-slate-400">Pilih siswa untuk melihat riwayat.</p>';
  const r = await api('getRiwayatTransaksiSiswa', {nisn:n}); if (!fail(r)) return;
  box.innerHTML = tbl([['Tanggal'], ['Jenis'], ['Nominal', 'text-right'], ['Pencatat'], ['Aksi', 'text-center']], r.data.map(d => `<tr>
    <td class="td whitespace-nowrap text-xs text-slate-500">${tgl(d.tanggal)}</td>
    <td class="td">${bdg(String(d.jenis).toUpperCase(), String(d.jenis).toLowerCase() === 'nabung' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700')}</td>
    <td class="td text-right font-bold">${rp(d.nominal)}</td><td class="td text-xs text-slate-400">${esc(d.pencatat)}</td>
    <td class="td text-center"><button data-act="batal" data-id="${esc(d.id)}" class="rounded-lg bg-rose-50 p-2 text-rose-600 hover:bg-rose-100" title="Batalkan transaksi"><i class="fas fa-ban"></i></button></td></tr>`).join(''));
}
function hint() {
  const s = siswa.find(x => x.nisn === $('s-siswa').value);
  $('saldo').innerHTML = s ? `<i class="fas fa-wallet"></i> Saldo: ${rp(s.saldo)}` : '';
}

// ---------- Aksi tombol ----------
const ACT = {
  menu() { side($('side').classList.contains('-translate-x-full')); },
  eye(d, el) {
    const p = $('p'), show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    $('eye-i').className = 'fas ' + (show ? 'fa-eye-slash' : 'fa-eye');
    el.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
    p.focus();
  },
  chip(d) { $('nom').value = Number(d.n).toLocaleString('id-ID'); },
  async logout() {
    if (!await ask('Keluar?', 'Akhiri sesi kerja ini.', 'Ya, keluar')) return;
    api('logout'); forceLogout();
  },
  async trx() {
    const n = $('s-siswa').value, j = $('jenis').value, v = num('nom'), s = siswa.find(x => x.nisn === n);
    if (!s || v <= 0) return warn('Pilih siswa dan isi nominal.');
    if (j === 'Tarik' && v > s.saldo) return warn('Saldo tidak cukup. Saldo ' + s.nama + ': ' + rp(s.saldo));
    if (!await ask(j === 'Nabung' ? 'Simpan tabungan?' : 'Proses penarikan?', s.nama + ': ' + rp(v))) return;
    const r = await work(() => api('simpanTransaksi', {nisn:n, jenis:j, nominal:v})); if (!r) return;
    if (fail(r)) {
      toast(r.message); $('nom').value = ''; await loadSiswa();
      const q = document.querySelector('[data-q="s-siswa"]'); q.value = ''; fill('s-siswa'); hint(); q.focus();
    }
  },
  async batal(d) {
    const x = await Swal.fire({title:'Batalkan transaksi?', input:'text', inputLabel:'Alasan pembatalan', inputValue:'Salah input', showCancelButton:true, confirmButtonText:'Ya, batalkan', cancelButtonText:'Tutup', confirmButtonColor:'#ef4444'});
    if (!x.isConfirmed) return;
    const r = await work(() => api('hapusTransaksi', {idTransaksi:d.id, alasan:x.value})); if (!r) return;
    if (fail(r)) { toast(r.message); loadRiw(); }
  },
  async setor() {
    const v = num('nom-setor');
    if (v <= 0) return warn('Isi nominal setoran.');
    if (v > kasTangan) return warn('Nominal melebihi kas di tangan Anda (' + rp(kasTangan) + ').');
    if (!await ask('Kirim setoran?', 'Setor ' + rp(v) + ' ke Kepala Sekolah.')) return;
    const r = await work(() => api('simpanSetoran', {nominal:v})); if (!r) return;
    if (fail(r)) { toast(r.message); PAGES.setor(); }
  },
  async spp() {
    const n = $('spp-siswa').value, b = $('spp-bln').value, nom = Number(settings.Nominal_SPP) || 0;
    if (!n || !b) return warn('Pilih siswa dan bulan.');
    if (nom <= 0) return warn('Nominal SPP belum diatur oleh Admin.');
    const s = siswa.find(x => x.nisn === n);
    if (!await ask('Catat SPP?', `${s.nama} • ${b} • ${rp(nom)}`)) return;
    const r = await work(() => api('simpanPembayaranBendahara', {nisn:n, bulan:b, nominalSPP:nom, nominalRekreasi:0})); if (!r) return;
    if (fail(r)) toast(r.message);
  },
  async acc(d) {
    if (!await ask('Terima setoran ini?', 'Pastikan uang fisik sudah Anda terima.', 'Ya, terima')) return;
    const r = await work(() => api('terimaSetoran', {id:d.id})); if (!r) return;
    if (fail(r)) { toast(r.message); PAGES.verif(); }
  },
  async addSiswa() {
    const p = {nisn:$('a-nisn').value.trim(), nama:$('a-nama').value.trim(), kelas:$('a-kelas').value.trim()};
    if (!p.nisn || !p.nama || !p.kelas) return warn('Lengkapi semua data.');
    const r = await work(() => api('tambahSiswaBaru', p)); if (!r) return;
    if (fail(r)) { toast(r.message); ['a-nisn', 'a-nama', 'a-kelas'].forEach(i => $(i).value = ''); }
  },
  async keluar() {
    const p = {sumber:$('o-sumber').value, keterangan:$('o-ket').value.trim(), nominal:num('o-nom')};
    if (!p.keterangan || p.nominal <= 0) return warn('Isi keperluan dan nominal.');
    if (!await ask('Potong kas?', `${p.sumber}: ${rp(p.nominal)} untuk ${p.keterangan}`, 'Ya, potong')) return;
    const r = await work(() => api('simpanPengeluaran', p)); if (!r) return;
    if (fail(r)) { toast(r.message); PAGES.keluar(); }
  },
  async atur() {
    const p = {}, spp = num('st-spp'), saldo = num('st-saldo');
    if (spp !== (Number(settings.Nominal_SPP) || 0)) p.nominalSPP = spp;                 // hanya kirim yang berubah
    if (saldo !== (Number(settings.Saldo_Awal_Bendahara) || 0)) p.saldoAwal = saldo;
    if (!Object.keys(p).length) return warn('Tidak ada perubahan.');
    const r = await work(() => api('updatePengaturan', p)); if (!r) return;
    if (fail(r)) { toast(r.message); PAGES.atur(); }
  }
};

// ---------- Event global ----------
document.addEventListener('click', e => {
  lastAct = Date.now();
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a.dataset, a);
});
$('ov').addEventListener('click', () => side(false));
document.addEventListener('keydown', () => lastAct = Date.now());
document.addEventListener('input', e => {
  const t = e.target;
  if (t.classList.contains('money')) { const d = t.value.replace(/\D/g, ''); t.value = d ? Number(d).toLocaleString('id-ID') : ''; }
  if (t.dataset.q === 'rekap') renderRekap(t.value);
  else if (t.dataset.q) fill(t.dataset.q, t.value);
});
document.addEventListener('change', e => {
  if (e.target.id === 's-siswa') hint();
  if (e.target.id === 'r-siswa') loadRiw();
  if (e.target.id === 'f-lap') renderLap();
});
$('lf').addEventListener('submit', async e => {
  e.preventDefault();
  const r = await work(() => api('login', {username:$('u').value, password:$('p').value}), 'Masuk...'); if (!r) return;
  if (r.success) { user = r; store.set(r); start(); toast(r.message); } else toast(r.message, false);
});
setInterval(() => { if (user && Date.now() - lastAct > 30 * 60000) forceLogout('Sesi berakhir karena tidak ada aktivitas.'); }, 60000);

document.querySelectorAll('.yr').forEach(e => e.textContent = new Date().getFullYear());

// Pulihkan sesi saat halaman di-refresh
const saved = store.get();
if (saved && saved.token) { user = saved; start(); }
</script>
</body>
</html>
